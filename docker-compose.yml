services:
  db:
    image: mysql:8.0
    container_name: hackhub-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hackhub_db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - hackhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hackhub-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackhub-backend
    restart: always
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hackhub_db}
      DB_USERNAME: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hackhub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackhub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hackhub-net

networks:
  hackhub-net:
    driver: bridge

volumes:
  hackhub_mysql_data: